<section class="contact" id="contacto">
	<div class="contact-copy">
		<span class="section-kicker">Contacto</span>
		<h2>Contacto simple.</h2>
		<p>Un formulario corto para consultas básicas.</p>

		<div class="contact-meta">
			<div>
				<strong>Mail</strong>
				<span>hola&#64;gamemart.gg</span>
			</div>
			<div>
				<strong>Horario</strong>
				<span>Lun a vie · 9:00 a 18:00</span>
			</div>
		</div>
	</div>

	<form class="contact-card">
		<label>
			<span>Nombre</span>
			<input type="text" placeholder="Tu nombre" />
		</label>

		<label>
			<span>Correo</span>
			<input type="email" placeholder="correo&#64;ejemplo.com" />
		</label>

		<label>
			<span>Interés</span>
			<input type="text" placeholder="Consulta breve" />
		</label>

		<button type="button">Enviar</button>
	</form>
</section>
