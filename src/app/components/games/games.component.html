<section class="catalog" id="catalogo">
	<div class="section-heading">
		<span class="section-kicker">Catálogo</span>
		<h2>Gestión de juegos y productos.</h2>
		<p>Alta, edición y eliminación de juegos conectados al backend de GameMart.</p>
	</div>

	<form class="game-form" (ngSubmit)="submit()">
		<div class="game-form-grid">
			<label>
				<span>Título</span>
				<input name="title" type="text" [(ngModel)]="form.title" placeholder="Nombre del juego" required />
			</label>

			<label>
				<span>Descripción</span>
				<input name="description" type="text" [(ngModel)]="form.description" placeholder="Detalle breve" required />
			</label>

			<label>
				<span>Precio</span>
				<input name="price" type="number" [(ngModel)]="form.price" min="0" step="0.01" required />
			</label>
		</div>

		<div class="form-actions">
			<button type="submit">{{ editingId === null ? 'Agregar juego' : 'Actualizar juego' }}</button>
			<button type="button" class="secondary" *ngIf="editingId !== null" (click)="cancel()">Cancelar</button>
		</div>
	</form>

	<p class="status" *ngIf="loading">Cargando juegos...</p>
	<p class="status error" *ngIf="error">{{ error }}</p>

	<div class="catalog-grid" *ngIf="!loading">
		<article *ngFor="let game of games">
			<span class="price">${{ game.price }}</span>
			<h3>{{ game.title }}</h3>
			<p>{{ game.description }}</p>

			<div class="card-actions">
				<button type="button" class="secondary" (click)="edit(game)">Editar</button>
				<button type="button" (click)="remove(game.id)">Eliminar</button>
			</div>
		</article>

		<p class="empty-state" *ngIf="games.length === 0">No hay juegos registrados todavía.</p>
	</div>
</section>
